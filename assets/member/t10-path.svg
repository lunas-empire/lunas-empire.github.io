<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">T10 unlock path</title>
<desc id="desc">HQ level 30 leads to Tech Center level 30 and Barracks level 30. The Special Forces prerequisites lead to Unit X. Unit X and the level 30 Barracks enable T10 training.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10202a"/><stop offset="1" stop-color="#182837"/></linearGradient><linearGradient id="gold" x2="1"><stop stop-color="#e6bc6b"/><stop offset="1" stop-color="#f2dba5"/></linearGradient></defs>
<rect width="720" height="900" rx="28" fill="url(#bg)"/>
<path d="M48 128H672M48 766H672" stroke="#425867" stroke-width="2"/>
<text x="48" y="72" fill="#f5f3e9" font-family="system-ui,sans-serif" font-size="35" font-weight="700">T10 / UNIT X</text>
<text x="48" y="109" fill="#b5c5cd" font-family="system-ui,sans-serif" font-size="19">LAST WAR · RESEARCH PATH</text>
<text x="48" y="180" fill="#e9c985" font-family="system-ui,sans-serif" font-size="17" font-weight="700" letter-spacing="2">BASE</text>
<circle cx="60" cy="226" r="11" fill="url(#gold)"/><text x="91" y="233" fill="#f5f3e9" font-family="system-ui,sans-serif" font-size="30" font-weight="650">HQ 30</text>
<path d="M60 242V340M60 340H101M60 340V580M60 580H101" fill="none" stroke="#96b7c1" stroke-width="3"/>
<circle cx="60" cy="340" r="5" fill="#96b7c1"/><circle cx="60" cy="580" r="5" fill="#96b7c1"/>
<text x="102" y="322" fill="#f5f3e9" font-family="system-ui,sans-serif" font-size="27" font-weight="650">TECH CENTER 30</text>
<text x="102" y="353" fill="#b5c5cd" font-family="system-ui,sans-serif" font-size="18">research access</text>
<path d="M102 376V472" stroke="#96b7c1" stroke-width="3"/>
<circle cx="102" cy="405" r="5" fill="#96b7c1"/>
<text x="138" y="414" fill="#d8e7e9" font-family="system-ui,sans-serif" font-size="22" font-weight="600">SPECIAL FORCES</text>
<text x="138" y="447" fill="#b5c5cd" font-family="system-ui,sans-serif" font-size="18">required nodes only</text>
<circle cx="102" cy="486" r="11" fill="url(#gold)"/><text x="136" y="495" fill="#f3d397" font-family="system-ui,sans-serif" font-size="29" font-weight="700">UNIT X</text>
<text x="102" y="561" fill="#f5f3e9" font-family="system-ui,sans-serif" font-size="27" font-weight="650">BARRACKS 30</text>
<text x="102" y="593" fill="#b5c5cd" font-family="system-ui,sans-serif" font-size="18">training location</text>
<path d="M102 510V672H340M102 610V672" fill="none" stroke="#96b7c1" stroke-width="3"/>
<circle cx="340" cy="672" r="6" fill="#e9c985"/>
<text x="366" y="683" fill="#f4d395" font-family="system-ui,sans-serif" font-size="37" font-weight="750">T10</text>
<text x="48" y="808" fill="#d8e7e9" font-family="system-ui,sans-serif" font-size="19">GOLD · VALOR BADGES · RESEARCH TIME</text>
<text x="48" y="841" fill="#aabdc5" font-family="system-ui,sans-serif" font-size="16">Check exact prerequisites in your game client.</text>
</svg>
