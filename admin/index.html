<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>R4/R5 Admin · RZSN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-shell">
    <a class="back-link" href="/">← Member Hub</a>
    <section class="login-card" aria-labelledby="login-title">
      <p class="alliance">RZSN · Server 2261</p>
      <h1 id="login-title">R4/R5 Admin</h1>
      <p class="intro">Geschützter Bereich für Allianzführung und Season-Planung.</p>
      <p class="intro en" lang="en">Protected area for alliance leadership and season planning.</p>
      <form id="unlock-form">
        <label for="admin-password">Passwort <span lang="en">/ Password</span></label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button id="unlock-button" type="submit">Admin-Bereich öffnen</button>
      </form>
      <p id="unlock-status" class="status" role="status" aria-live="polite"></p>
      <p class="privacy">Das Passwort wird nur lokal zur Entschlüsselung verwendet und nicht übertragen oder gespeichert.</p>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
